version: 2

updates:
  - package-ecosystem: npm
    directory: /nextjs
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-patch:
        update-types:
          - patch
    labels:
      - dependencies

  - package-ecosystem: uv
    directory: /dbt-runner
    schedule:
      interval: weekly
      day: monday
    groups:
      python-patch:
        update-types:
          - patch
    labels:
      - dependencies

  - package-ecosystem: docker
    directories:
      - /dbt-runner
      - /nextjs
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
