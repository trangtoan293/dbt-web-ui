name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  images:
    if: vars.PUBLIC_RELEASE_APPROVED == 'true'
    environment: public-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: frontend
            context: nextjs
          - component: dbt-runner
            context: dbt-runner
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@703896b4f30f62d53f5530a80bcdc589a3f702bc
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: type=semver,pattern={{version}}
      - id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true
      - name: Block vulnerable release images
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}-${{ matrix.component }}@${{ steps.image.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          docker run --rm
          --env TRIVY_USERNAME
          --env TRIVY_PASSWORD
          aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
          image --exit-code 1
          --severity HIGH,CRITICAL
          "$IMAGE_REF"
      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  github-release:
    if: vars.PUBLIC_RELEASE_APPROVED == 'true'
    needs:
      - images
    environment: public-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
