[project]
name = "dbt-runner"
version = "0.1.0"
description = "FastAPI backend for dbt-craft"
requires-python = ">=3.11,<3.14"
authors = [{ name = "dbt-craft contributors" }]
license = "MIT"
keywords = ["dbt", "data-engineering", "ide", "fastapi", "analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "fastapi>=0.125.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.21",
    "dbt-core==1.10.16",
    "dbt-dremio==1.10.0",
    "dbt-postgres==1.10.0",
    "dbt-duckdb==1.10.0",
    "dbt-oracle==1.10.0",
    "gitpython>=3.1.45",
    "pyyaml>=6.0.03",
    "httpx>=0.28.1",
    "oracledb>=2.5.0",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "PyJWT[crypto]>=2.13.0",
    "duckdb>=1.4.3",
    "pyarrow>=22.0.0",
    "sqlglot>=28.5.0",
    "redis>=7.1.0",
    "aiofiles>=25.1.0",
    "watchdog>=6.0.0",
    # Cron parsing for the run scheduler. A correct cron expression parser is
    # not "a few lines": day-of-month and day-of-week are OR'd, not AND'd, and
    # ranges, steps and lists all compose. Not worth reimplementing.
    "croniter>=6.0.0",
    # Publishing lake marts as Iceberg, so engines that are not DuckDB can read
    # them. Pure Python plus one Rust wheel - no JVM, unlike dbt-spark, which is
    # why this is a plain dependency and not an extra.
    "pyiceberg[sql-postgres,pyarrow]>=0.11.1",
    # Ingest: dlt loads source tables into DuckLake / the project warehouse.
    # The ducklake extra needs no pyiceberg of its own - duckdb and pyarrow are
    # already here, and the Iceberg publisher above brings pyiceberg.
    "dlt[ducklake]>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "safety",
    "bandit",
    "black",
    "isort",
    "mypy",
]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.0",
]
spark = [
    "dbt-spark[session,PyHive]==1.11.0",
    "pandas>=2.2.0",
    "grpcio>=1.48.1",
    "grpcio-status>=1.48.1",
    "googleapis-common-protos>=1.56.0",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
# test_concurrency.py is a manual diagnostic script (print-based, needs a live
# redis + running services), not a unit test. Async unit tests use
# unittest.IsolatedAsyncioTestCase, which manages its own loop, so the default
# (strict) asyncio mode is correct — do not switch to auto.
addopts = "--ignore=tests/test_concurrency.py"

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 88
